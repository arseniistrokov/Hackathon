[project]
name = "chisinau-assistant"
version = "0.1.0"
description = "Evidence-grounded bilingual municipal assistant (RO/RU) over 40 official Chișinău sources"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "httpx==0.28.1",
    "numpy==2.3.3",
    "trafilatura==2.0.0",
    "pymupdf==1.26.4",
    "pyyaml==6.0.2",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
# Модели весят гигабайты: ставятся только на машине, где есть GPU. Тесты их не требуют.
ml = [
    "sentence-transformers==5.1.1",
    "torch==2.8.0",
]
stt = [
    "faster-whisper>=1.0",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
